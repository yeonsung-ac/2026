<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed Nabi</title>
<link rel="stylesheet" href="common.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="common.js"></script>
</head>
<body>
<main></main>
<div class="bar">
  <a href="index.html">◀ 게임 고르기</a><span class="grow"></span>
  <span class="chip">♥ <b id="hearts">3</b></span>
  <span class="chip">점수 <b id="score">0</b></span>
  <span class="chip"><b id="time">60</b>초</span>
</div>

<div id="start" class="screen">
  <div class="card">
    <img class="who" src="img/nabi.png" alt="">
    <h1>Feed Nabi<small>나비 밥 주기</small></h1>
    <p>헤이즐이 위에서 먹을 것을 떨어뜨려요.<br><b>생선·우유·쿠키</b>는 받고, <b>양말·장화</b>는 피하세요!</p>
    <p style="font-size:13px">마우스나 손가락으로 나비를 움직여요 · 키보드 ← →</p>
    <div class="btns"><button class="btn" id="go">Start · 시작</button></div>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="card">
    <img class="who" src="img/drlee.png" alt="">
    <h1 id="o-title">Good job!<small>잘했어요!</small></h1>
    <div class="big" id="o-score">0</div>
    <div class="best" id="o-best"></div>
    <div class="btns">
      <button class="btn" id="again">Play again · 다시</button>
      <a class="btn ghost" href="index.html">다른 게임</a>
    </div>
  </div>
</div>

<script>
const GOOD = [
  { k: "fish", ko: "생선" }, { k: "milk", ko: "우유" }, { k: "cookie", ko: "쿠키" },
];
const BAD = [{ k: "sock", ko: "양말" }, { k: "boot", ko: "장화" }];
const TIME = 60;
let state = "ready", items = [], floats = [], score = 0, hearts = 3, tLeft = TIME, nextDrop = 0;
let nabi = { x: 0, tx: 0, happy: 0, hurt: 0 }, hazel = { x: 0, dir: 1, drop: 0 };

function preload() { loadSprites(["nabi", "hazel_walk", "hazel_point_R"]); }
function setup() {
  createCanvas(windowWidth, windowHeight).parent(document.querySelector("main"));
  textFont("GmarketSans"); textAlign(CENTER, CENTER);
  nabi.x = nabi.tx = width / 2; hazel.x = width * 0.3;
  $("go").onclick = start; $("again").onclick = start;
}
function windowResized() { resizeCanvas(windowWidth, windowHeight); }

function start() {
  tone([[1, 0.01, "sine", 0.0001]]);
  state = "play"; items = []; floats = []; score = 0; hearts = 3; tLeft = TIME; nextDrop = 0.8;
  nabi.x = nabi.tx = width / 2;
  show("start", false); show("over", false); hud();
}
function hud() { $("hearts").textContent = hearts; $("score").textContent = score; $("time").textContent = Math.ceil(tLeft); }
function finish() {
  state = "over";
  const best = setBest("feed", score);
  $("o-score").textContent = score;
  $("o-best").textContent = "최고 점수 " + best;
  $("o-title").innerHTML = score >= 25 ? "Wonderful!<small>나비가 배불러요!</small>" : score >= 12 ? "Good job!<small>잘했어요!</small>" : "Nice try!<small>한 번 더 해 볼까요?</small>";
  SFX.win();
  show("over");
}

/* 위치 */
const floorY = () => height - U() * 10;
const nabiH = () => U() * 30;
const shelfY = () => U() * 34 + 40;

function pointerMove(x) { if (state === "play") nabi.tx = constrain(x, nabiH() * 0.35, width - nabiH() * 0.35); }
function mouseMoved() { pointerMove(mouseX); }
function mouseDragged() { pointerMove(mouseX); }
function touchMoved() { pointerMove(mouseX); return false; }
function touchStarted() { pointerMove(mouseX); }

function draw() {
  const dt = Math.min(deltaTime / 1000, 0.05), t = millis() / 1000;
  if (state === "play") update(dt);
  scene(t);
}

function update(dt) {
  if (keyIsDown(LEFT_ARROW)) nabi.tx -= width * 0.9 * dt;
  if (keyIsDown(RIGHT_ARROW)) nabi.tx += width * 0.9 * dt;
  nabi.tx = constrain(nabi.tx, nabiH() * 0.35, width - nabiH() * 0.35);
  nabi.x = lerp(nabi.x, nabi.tx, Math.min(1, dt * 14));
  tLeft -= dt;
  const level = 1 - tLeft / TIME;               // 0 → 1 로 갈수록 빨라진다
  // 헤이즐은 선반 위를 걸어 다닌다
  hazel.x += hazel.dir * width * (0.12 + level * 0.12) * dt;
  if (hazel.x < width * 0.12) hazel.dir = 1;
  if (hazel.x > width * 0.88) hazel.dir = -1;
  if (Math.random() < dt * 0.4) hazel.dir *= -1;
  nextDrop -= dt;
  if (nextDrop <= 0) {
    const bad = Math.random() < 0.28 + level * 0.12;
    const it = random(bad ? BAD : GOOD);
    items.push({ ...it, bad, x: hazel.x + hazel.dir * U() * 4, y: shelfY() - U() * 12, vy: height * (0.16 + level * 0.22), rot: 0, vr: random(-2, 2) });
    hazel.drop = 0.35;
    nextDrop = 1.05 - level * 0.55 + Math.random() * 0.25;
  }
  hazel.drop -= dt; nabi.happy -= dt; nabi.hurt -= dt;
  const mouthY = floorY() - nabiH() * 0.55, reach = nabiH() * 0.32;
  for (const it of items) {
    it.vy += height * 0.25 * dt; it.y += it.vy * dt; it.rot += it.vr * dt;
    if (!it.done && Math.abs(it.y - mouthY) < nabiH() * 0.2 && Math.abs(it.x - nabi.x) < reach) {
      it.done = true;
      if (it.bad) { hearts--; nabi.hurt = 0.6; SFX.bad(); floats.push({ x: it.x, y: floorY() - nabiH() * 1.05, s: "No " + it.k + "!", c: "#ec4a4a", t: 0 }); }
      else { score++; nabi.happy = 0.7; SFX.good(); floats.push({ x: it.x, y: floorY() - nabiH() * 1.05, s: "+1 " + it.k, c: "#2fb866", t: 0 }); }
    }
  }
  items = items.filter((i) => !i.done && i.y < height + 80);
  for (const f of floats) f.t += dt;
  floats = floats.filter((f) => f.t < 0.9);
  hud();
  if (hearts <= 0 || tLeft <= 0) { tLeft = Math.max(0, tLeft); hud(); finish(); }
}

function scene(t) {
  // 하늘·방
  const g = drawingContext.createLinearGradient(0, 0, 0, height);
  g.addColorStop(0, "#9fd3f7"); g.addColorStop(1, "#e3f3ff");
  drawingContext.fillStyle = g; noStroke(); rect(0, 0, width, height);
  // 창문
  fill(255, 255, 255, 120); rect(width * 0.62, shelfY() + U() * 6, U() * 26, U() * 22, 12);
  stroke(255); strokeWeight(U() * 0.8); line(width * 0.62 + U() * 13, shelfY() + U() * 6, width * 0.62 + U() * 13, shelfY() + U() * 28); noStroke();
  // 선반
  fill("#c9925e"); rect(0, shelfY(), width, U() * 2.4);
  fill("#a87444"); rect(0, shelfY() + U() * 2.4, width, U() * 1);
  // 바닥
  fill("#f1d9b5"); rect(0, floorY(), width, height - floorY());
  fill("#e2c296"); rect(0, floorY(), width, U() * 1.2);
  // 헤이즐
  const hh = U() * 26;
  if (hazel.drop > 0) drawSprite("hazel_point_R", hazel.x, shelfY(), hh, { frame: 4, flip: hazel.dir < 0 });
  else drawSprite("hazel_walk", hazel.x, shelfY(), hh, { t, flip: hazel.dir < 0 });
  // 떨어지는 것
  for (const it of items) drawItem(it);
  // 나비
  const bob = Math.sin(t * 6) * U() * 0.6;
  let frame = 0, sx = 1, sy = 1;
  if (nabi.happy > 0) { frame = 4 + Math.floor((0.7 - nabi.happy) * 14) % 6; sy = 1 + Math.sin(nabi.happy * 20) * 0.04; }
  if (nabi.hurt > 0) { sx = 1 + Math.sin(nabi.hurt * 40) * 0.05; }
  drawSprite("nabi", nabi.x, floorY() + bob * 0.2, nabiH(), { frame, sx, sy, flip: nabi.tx < nabi.x - 2 });
  if (nabi.hurt > 0) { fill(236, 74, 74, 90 * nabi.hurt); ellipse(nabi.x, floorY() - nabiH() * 0.45, nabiH() * 0.8); }
  // 점수 글
  for (const f of floats) {
    fill(f.c); textSize(U() * 4.2); textStyle(BOLD);
    text(f.s, f.x, f.y - f.t * U() * 14);
  }
}

function drawItem(it) {
  const s = U() * 6.5;
  push(); translate(it.x, it.y); rotate(it.rot);
  noStroke();
  if (it.k === "fish") {
    fill("#5aa9e6"); ellipse(0, 0, s * 1.6, s * 0.9); triangle(s * 0.7, 0, s * 1.2, -s * 0.45, s * 1.2, s * 0.45);
    fill(255); ellipse(-s * 0.45, -s * 0.1, s * 0.25); fill(30); ellipse(-s * 0.45, -s * 0.1, s * 0.12);
  } else if (it.k === "milk") {
    fill(255); rect(-s * 0.45, -s * 0.5, s * 0.9, s * 1.1, 4); fill("#5aa9e6"); rect(-s * 0.45, -s * 0.05, s * 0.9, s * 0.3);
    fill("#e8eef5"); triangle(-s * 0.45, -s * 0.5, s * 0.45, -s * 0.5, 0, -s * 0.85);
  } else if (it.k === "cookie") {
    fill("#d79a52"); ellipse(0, 0, s * 1.2); fill("#6b3f1d"); for (const [a, b] of [[-.2, -.2], [.25, -.1], [0, .25], [-.25, .2]]) ellipse(a * s, b * s, s * 0.16);
  } else if (it.k === "sock") {
    fill("#9b6cd8"); rect(-s * 0.3, -s * 0.6, s * 0.55, s * 0.9, 6); ellipse(-s * 0.05, s * 0.32, s * 0.95, s * 0.5);
    fill(255); rect(-s * 0.3, -s * 0.6, s * 0.55, s * 0.18);
  } else if (it.k === "boot") {
    fill("#4e7a3a"); rect(-s * 0.35, -s * 0.6, s * 0.6, s * 0.95, 5); rect(-s * 0.35, s * 0.15, s * 1.0, s * 0.35, 8);
  }
  pop();
  // 영어 이름표
  textSize(U() * 2.8); textStyle(BOLD);
  const w = textWidth(it.k) + U() * 3;
  fill(255, 255, 255, 230); rect(it.x - w / 2, it.y + s * 0.75, w, U() * 4.2, 99);
  fill(it.bad ? "#c03a3a" : "#1d2550"); text(it.k, it.x, it.y + s * 0.75 + U() * 2.2);
}
</script>
</body>
</html>
