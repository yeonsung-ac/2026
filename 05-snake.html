<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클래식 뱀게임 챔피언십</title>
  <meta name="description" content="기록에 도전하는 클래식 뱀게임">
  <link rel="canonical" href="https://yeonsung-ac.github.io/2026/05-snake.html">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --snake-head: #22c55e;
      --snake-body: #4ade80;
      --food-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 460px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 1px solid #334155;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: var(--accent-color);
    }

    .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }

    .score-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .score-label {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .score-value {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .game-board-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 16px;
    }

    canvas {
      background-color: #020617;
      border: 2px solid #334155;
      border-radius: 12px;
      display: block;
    }

    .status-banner {
      min-height: 36px;
      line-height: 36px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      background-color: #0f172a;
      margin-bottom: 16px;
      color: #94a3b8;
    }

    /* 모바일/마우스 터치 컨트롤 패드 */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-arrow {
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text-color);
      width: 48px;
      height: 48px;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .btn-arrow:active {
      background: #334155;
    }

    .btn-action {
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
<!-- site nav (added 2026-08-16) -->
<style>
.sitebar{position:fixed;top:12px;left:12px;z-index:99999;display:flex;gap:6px;
  font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:13px;line-height:1}
.sitebar a{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:999px;
  background:rgba(255,255,255,.94);color:#17233b;text-decoration:none;font-weight:700;
  border:1px solid rgba(23,35,59,.12);box-shadow:0 3px 10px rgba(0,0,0,.18);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .15s,box-shadow .15s}
.sitebar a:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.24)}
.sitebar a.ghost{background:rgba(255,255,255,.72);font-weight:600;color:#53617d}
@media (max-width:520px){.sitebar{top:8px;left:8px;font-size:12px}.sitebar a{padding:7px 11px}}
@media print{.sitebar{display:none}}
</style>
<nav class="sitebar" aria-label="사이트 이동">
  <a href="./" aria-label="웹게임 놀이터 목록으로 이동"><span aria-hidden="true">←</span> 놀이터</a>
  <a class="ghost" href="https://yeonsung-ac.github.io/" aria-label="홈페이지로 이동">홈</a>
</nav>


<div class="container">
  <h1>🐍 뱀게임 챔피언십</h1>
  <p class="subtitle">방향키로 먹이를 먹고 최장 길이에 도전하세요!</p>

  <div class="scoreboard">
    <div class="score-item">
      <span class="score-label">현재 점수</span>
      <span class="score-value" id="currentScore" style="color: var(--accent-color);">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">최고 점수</span>
      <span class="score-value" id="highScore">0</span>
    </div>
  </div>

  <div class="game-board-wrapper">
    <canvas id="gameCanvas" width="360" height="360"></canvas>
  </div>

  <div class="status-banner" id="statusBanner">게임 시작 버튼 또는 방향키를 누르세요!</div>

  <!-- 가상 키패드 (모바일 겸용) -->
  <div class="controls">
    <button class="btn-arrow" onclick="handleDirection('UP')">▲</button>
    <div class="btn-row">
      <button class="btn-arrow" onclick="handleDirection('LEFT')">◀</button>
      <button class="btn-arrow" onclick="handleDirection('DOWN')">▼</button>
      <button class="btn-arrow" onclick="handleDirection('RIGHT')">▶</button>
    </div>
  </div>

  <button class="btn-action" id="startBtn" onclick="startGame()">게임 시작</button>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const gridSize = 18;
  const tileCount = canvas.width / gridSize;

  let snake = [];
  let food = { x: 0, y: 0 };
  let dx = gridSize;
  let dy = 0;

  let score = 0;
  let highScore = 0;
  let gameLoop = null;
  let isRunning = false;
  let nextDirection = { dx: gridSize, dy: 0 };

  const currentScoreEl = document.getElementById('currentScore');
  const highScoreEl = document.getElementById('highScore');
  const statusBanner = document.getElementById('statusBanner');
  const startBtn = document.getElementById('startBtn');

  function initGame() {
    snake = [
      { x: 5 * gridSize, y: 10 * gridSize },
      { x: 4 * gridSize, y: 10 * gridSize },
      { x: 3 * gridSize, y: 10 * gridSize }
    ];
    dx = gridSize;
    dy = 0;
    nextDirection = { dx: gridSize, dy: 0 };
    score = 0;
    currentScoreEl.textContent = score;
    spawnFood();
  }

  function spawnFood() {
    food.x = Math.floor(Math.random() * tileCount) * gridSize;
    food.y = Math.floor(Math.random() * tileCount) * gridSize;

    // 먹이가 뱀 몸통 위에 생기지 않도록 재배치
    snake.forEach(segment => {
      if (segment.x === food.x && segment.y === food.y) {
        spawnFood();
      }
    });
  }

  function draw() {
    // 배경 지우기
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 먹이 그리기
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // 뱀 그리기
    snake.forEach((segment, index) => {
      ctx.fillStyle = index === 0 ? '#22c55e' : '#4ade80';
      ctx.fillRect(segment.x + 1, segment.y + 1, gridSize - 2, gridSize - 2);
    });
  }

  function moveSnake() {
    dx = nextDirection.dx;
    dy = nextDirection.dy;

    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

    // 벽 충돌 감지
    if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
      gameOver();
      return;
    }

    // 자기 몸통 충돌 감지
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        gameOver();
        return;
      }
    }

    snake.unshift(head);

    // 먹이 섭취 여부 확인
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      currentScoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
      }
      spawnFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function handleDirection(dir) {
    if (!isRunning) return;

    if (dir === 'UP' && dy === 0) nextDirection = { dx: 0, dy: -gridSize };
    if (dir === 'DOWN' && dy === 0) nextDirection = { dx: 0, dy: gridSize };
    if (dir === 'LEFT' && dx === 0) nextDirection = { dx: -gridSize, dy: 0 };
    if (dir === 'RIGHT' && dx === 0) nextDirection = { dx: gridSize, dy: 0 };
  }

  // 키보드 방향키 조작
  document.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
      e.preventDefault();
    }

    if (!isRunning && (e.key.startsWith('Arrow') || e.key === ' ')) {
      startGame();
      return;
    }

    if (e.key === 'ArrowUp') handleDirection('UP');
    if (e.key === 'ArrowDown') handleDirection('DOWN');
    if (e.key === 'ArrowLeft') handleDirection('LEFT');
    if (e.key === 'ArrowRight') handleDirection('RIGHT');
  });

  function startGame() {
    if (isRunning) clearInterval(gameLoop);

    initGame();
    isRunning = true;
    startBtn.textContent = '다시 시작';
    statusBanner.textContent = '게임 진행 중...';
    
    draw();
    gameLoop = setInterval(moveSnake, 110);
  }

  function gameOver() {
    clearInterval(gameLoop);
    isRunning = false;
    statusBanner.textContent = `💀 게임 오버! (최종 점수: ${score}점)`;
    startBtn.textContent = '다시 도전하기';
  }

  // 초기 보드 그리기
  initGame();
  draw();
</script>

</body>
</html>
