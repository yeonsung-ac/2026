<div class="container">
  <h1>🎲 3D 주사위 챔피언십</h1>
  <p class="subtitle">30점에 먼저 도달하는 사람이 챔피언!</p>

  <div class="scoreboard">
    <div class="player-score active" id="p1Card">
      <span class="player-name p1-name">PLAYER 1</span>
      <span class="score-val" id="p1Score">0</span>
    </div>
    <div class="player-score" id="p2Card">
      <span class="player-name p2-name">PLAYER 2</span>
      <span class="score-val" id="p2Score">0</span>
    </div>
  </div>

  <div class="arena">
    <div class="cube" id="cube">
      <!-- 6개의 주사위 면과 9개의 그리드 구역 -->
      <div class="face face-1"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="face face-2"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="face face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="face face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="face face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="face face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
  </div>

  <div class="status-banner" id="statusBanner">Player 1 차례입니다!</div>

  <div class="controls">
    <button class="btn-roll" id="rollBtn" onclick="rollDice()">주사위 굴리기</button>
    <button class="btn-reset" onclick="resetGame()">게임 초기화</button>
  </div>
</div>

<script>
  let scores = [0, 0];
  let currentPlayer = 0; // 0: Player 1, 1: Player 2
  const targetScore = 30;
  let isRolling = false;

  // 눈금별 3D 회전 각도 좌표
  const rotationMap = {
    1: { x: 0, y: 0 },
    2: { x: 0, y: 90 },
    3: { x: -90, y: 0 },
    4: { x: 90, y: 0 },
    5: { x: 0, y: -90 },
    6: { x: 0, y: 180 }
  };

  let xRotation = 0;
  let yRotation = 0;

  const cube = document.getElementById('cube');
  const rollBtn = document.getElementById('rollBtn');
  const statusBanner = document.getElementById('statusBanner');
  const p1ScoreEl = document.getElementById('p1Score');
  const p2ScoreEl = document.getElementById('p2Score');
  const p1Card = document.getElementById('p1Card');
  const p2Card = document.getElementById('p2Card');

  function rollDice() {
    if (isRolling) return;
    isRolling = true;
    rollBtn.disabled = true;

    const rolledValue = Math.floor(Math.random() * 6) + 1;
    
    // 회전 애니메이션 연출 (최소 4바퀴 이상 돌도록 멀티 회전 추가)
    const extraRotations = 360 * 4;
    const target = rotationMap[rolledValue];

    xRotation += extraRotations + target.x;
    yRotation += extraRotations + target.y;

    cube.style.transform = `rotateX(${xRotation}deg) rotateY(${yRotation}deg)`;

    statusBanner.textContent = '주사위가 구르는 중...';

    setTimeout(() => {
      scores[currentPlayer] += rolledValue;
      updateUI();

      if (scores[currentPlayer] >= targetScore) {
        statusBanner.textContent = `🎉 PLAYER ${currentPlayer + 1} 승리! 챔피언 등극!`;
        rollBtn.disabled = true;
      } else {
        // 차례 변경
        currentPlayer = currentPlayer === 0 ? 1 : 0;
        statusBanner.textContent = `Player ${currentPlayer + 1} 차례입니다! (+${rolledValue} 획득)`;
        updateActiveCard();
        isRolling = false;
        rollBtn.disabled = false;
      }
    }, 1500);
  }

  function updateUI() {
    p1ScoreEl.textContent = scores[0];
    p2ScoreEl.textContent = scores[1];
  }

  function updateActiveCard() {
    if (currentPlayer === 0) {
      p1Card.classList.add('active');
      p2Card.classList.remove('active');
    } else {
      p2Card.classList.add('active');
      p1Card.classList.remove('active');
    }
  }

  function resetGame() {
    scores = [0, 0];
    currentPlayer = 0;
    isRolling = false;
    xRotation = 0;
    yRotation = 0;
    cube.style.transform = 'rotateX(0deg) rotateY(0deg)';
    updateUI();
    updateActiveCard();
    statusBanner.textContent = 'Player 1 차례입니다!';
    rollBtn.disabled = false;
  }
</script>
