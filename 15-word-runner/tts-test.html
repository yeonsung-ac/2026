<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>읽어 주기 소리 시험</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#1d2321;--sub:#5d6a66;--acc:#1f7a5c;--line:#dfe5e2}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--card:#1d2421;--ink:#e8eeeb;--sub:#9aa9a4;--acc:#5cc29a;--line:#2d3833}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:16px}
h1{font-size:21px;margin:4px 0 6px}p{color:var(--sub);margin:0 0 14px;font-size:14px}
button{display:block;width:100%;margin:0 0 10px;padding:16px 14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:600 17px/1.3 inherit;text-align:left}
button small{display:block;font-weight:400;font-size:13px;opacity:.85}
#log{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;min-height:80px}
</style></head><body>
<h1>읽어 주기 소리 시험</h1>
<p>버튼을 하나씩 눌러 보세요. 영어로 <b>"appointment"</b>가 들리는 번호를 알려 주시면 됩니다. 아래 기록 칸을 캡처해 주셔도 좋아요.</p>
<button id="b1">① 기본 목소리로 읽기<small>목소리를 고르지 않고 언어만 en-US</small></button>
<button id="b2">② 영어 목소리를 골라서 읽기<small>게임이 지금 쓰는 방식</small></button>
<button id="b3">③ 언어 지정 없이 읽기<small>휴대폰 기본 설정 그대로</small></button>
<button id="b4">④ 게임처럼 0.1초 뒤에 읽기<small>누른 순간이 아니라 조금 뒤에 읽기 시작</small></button>
<div id="log"></div>
<script>
var L=document.getElementById('log');
function log(t){L.textContent+=t+'\n';}
var s=window.speechSynthesis, keep=[];
log('브라우저: '+navigator.userAgent);
log('speechSynthesis: '+(s?'있음':'없음'));
function voices(){var v=s?s.getVoices():[];return v;}
function listV(){var v=voices();var en=v.filter(function(x){return /^en/i.test(x.lang)});
 log('목소리 '+v.length+'개 · 영어 '+en.length+'개'+(en.length?' (예: '+en.slice(0,3).map(function(x){return x.name+' '+x.lang+(x.localService?'':' [온라인]')}).join(', ')+')':''));}
if(s){listV(); if(s.onvoiceschanged!==undefined) s.onvoiceschanged=function(){log('— 목소리 목록이 늦게 들어옴'); listV();};}
function say(mode){
 if(!s){log('읽어 주기를 지원하지 않는 브라우저예요');return;}
 var u=new SpeechSynthesisUtterance('appointment'); keep.push(u);
 if(mode!==3) u.lang='en-US';
 if(mode===2){var v=voices(),pick=null,pre=[/Google US English/i,/Samantha/i,/Aria/i,/Jenny/i,/Natural/i,/Zira/i];
  for(var k=0;k<pre.length&&!pick;k++)for(var i=0;i<v.length;i++)if(/^en[-_]US/i.test(v[i].lang)&&pre[k].test(v[i].name)){pick=v[i];break;}
  if(!pick)for(var j=0;j<v.length;j++)if(/^en/i.test(v[j].lang)){pick=v[j];break;}
  if(pick){u.voice=pick;log('② 고른 목소리: '+pick.name+' '+pick.lang);} else log('② 영어 목소리를 못 찾음');}
 u.rate=0.88;
 u.onstart=function(){log('('+mode+') 읽기 시작 ✓');};
 u.onend=function(){log('('+mode+') 읽기 끝');};
 u.onerror=function(e){log('('+mode+') 오류: '+(e.error||e));};
 try{s.cancel();}catch(e){}
 try{s.resume();}catch(e){}
 s.speak(u);
 log('('+mode+') 읽기 요청 · speaking='+s.speaking+' pending='+s.pending);
 setTimeout(function(){log('('+mode+') 1.5초 뒤 · speaking='+s.speaking+' pending='+s.pending+' paused='+s.paused);},1500);
}
document.getElementById('b1').onclick=function(){say(1);};
document.getElementById('b2').onclick=function(){say(2);};
document.getElementById('b3').onclick=function(){say(3);};
document.getElementById('b4').onclick=function(){setTimeout(function(){say(4);},100);};
</script>
</body></html>
